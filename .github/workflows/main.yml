name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          echo "Found: $F"
          if [ -z "$F" ]; then echo "settings.gradle.kts not found"; find . -not -path './.git/*' | head -50; exit 1; fi
          cd "$(dirname "$F")"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Boori3-APK
          path: "**/build/outputs/apk/debug/*.apk"
